<meta name="author" content="Ja Vchu Dutch">
<meta name="color-scheme" content="light dark">
{{ with resources.Get "css/site.css" }}
  {{ $css := . | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ end }}
<script>
  // Applied before first paint, otherwise a visitor who chose dark gets a
  // flash of the light page on every navigation.
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      if (stored === 'dark' || stored === 'light') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) {}
    // Marks that scripting is available, so the stylesheet may collapse the
    // mobile menu. Set here rather than on load so the panel never flashes
    // open, and absent entirely without JS, where the button would be dead.
    document.documentElement.classList.add('js');
  })();

  // Delegated, so it works regardless of where the button ends up in the header.
  document.addEventListener('click', function (event) {
    var button = event.target.closest && event.target.closest('.theme-toggle');
    if (!button) return;
    var root = document.documentElement;
    var current = root.getAttribute('data-theme');
    if (!current) {
      current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  // Same delegation as above: the header markup is the theme's, so nothing
  // here depends on where the button sits.
  document.addEventListener('click', function (event) {
    var button = event.target.closest && event.target.closest('.nav-toggle');
    if (!button) return;
    var nav = button.closest('nav');
    if (!nav) return;
    var open = nav.hasAttribute('data-nav-open');
    if (open) {
      nav.removeAttribute('data-nav-open');
    } else {
      nav.setAttribute('data-nav-open', '');
    }
    button.setAttribute('aria-expanded', open ? 'false' : 'true');
  });
</script>
