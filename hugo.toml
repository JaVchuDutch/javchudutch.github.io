baseURL = 'https://javchudutch.com/'

title = 'Ja Vchu Dutch - Learn Dutch together'
# Footer copyright. Without it the footer falls back to the full site title,
# which is a whole sentence in each language. The brand name is the same in
# both, so one top-level value covers uk and nl.
copyright = 'Ja Vchu Dutch'
theme = 'ananke'
defaultContentLanguage = 'uk'
enableRobotsTXT = true

[frontmatter]
lastmod = ['lastmod', ':fileModTime', ':default']
date = [':filename', ':default']

[pagination]
pagerSize = 100

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[languages]

[languages.uk]
disabled = false
locale = 'uk'
label = 'Українська'
weight = 0
title = 'Ja Vchu Dutch - вчимо нідерландську мову разом'
[languages.uk.menus]
[[languages.uk.menus.main]]
name = 'Публікації'
pageRef = '/posts'
weight = 1
[[languages.uk.menus.main]]
name = 'Ресурси'
pageRef = '/resources'
weight = 2
[[languages.uk.menus.main]]
name = 'Про мене'
pageRef = '/about'
weight = 3
[[languages.uk.menus.main]]
name = 'Як я працюю'
pageRef = '/approach'
weight = 4
[[languages.uk.menus.main]]
name = 'Контакт'
pageRef = '/contact'
weight = 5
# Розкоментуйте, коли на сторінці /reviews з'являться справжні відгуки
# і буде прибрано draft = true у content/reviews/_index.uk.md.
# Змініть weight, щоб посунути пункт у потрібне місце меню.
#[[languages.uk.menus.main]]
#name = 'Відгуки'
#pageRef = '/reviews'
#weight = 7
# Privacy belongs in the footer, not in the top menu: it is a page people look
# for deliberately, and it was crowding a menu that has to fit on a phone.
[[languages.uk.menus.footer]]
name = 'Конфіденційність'
pageRef = '/privacy'
weight = 1
[languages.uk.params]
[languages.uk.params.consent]
[[languages.uk.params.consent.items]]
slug = 'analytics'
title = 'Статистика відвідувань'
description = 'Google Analytics рахує перегляди сторінок і зберігає у вашому браузері файл cookie з унікальним ідентифікатором.'
is_functional = false

[[languages.uk.params.consent.items]]
slug = 'advertising'
title = 'Реклама'
description = 'Дозволяє пов’язувати ваш візит з рекламними кампаніями Google і показувати рекламу цього сайту. Окремо від статистики.'
is_functional = false

[languages.nl]
disabled = false
locale = 'nl'
label = 'Nederlands'
weight = 1
title = 'Ja Vchu Dutch - Samen Nederlands leren'
[languages.nl.menus]
[[languages.nl.menus.main]]
name = 'Publicaties'
pageRef = '/posts'
weight = 1
[[languages.nl.menus.main]]
name = 'Bronnen'
pageRef = '/resources'
weight = 2
[[languages.nl.menus.main]]
name = 'Over mij'
pageRef = '/about'
weight = 3
[[languages.nl.menus.main]]
name = 'Hoe ik werk'
pageRef = '/approach'
weight = 4
[[languages.nl.menus.main]]
name = 'Contact'
pageRef = '/contact'
weight = 5
# Haal uit commentaar zodra er echte ervaringen op /reviews staan
# en draft = true uit content/reviews/_index.nl.md is verwijderd.
#[[languages.nl.menus.main]]
#name = 'Ervaringen'
#pageRef = '/reviews'
#weight = 7
[[languages.nl.menus.footer]]
name = 'Privacy'
pageRef = '/privacy'
weight = 1
[[languages.nl.params.consent.items]]
slug = 'analytics'
title = 'Bezoekersstatistieken'
description = 'Google Analytics telt paginaweergaven en slaat een cookie met een unieke identificatie in je browser op.'
is_functional = false

[[languages.nl.params.consent.items]]
slug = 'advertising'
title = 'Advertenties'
description = 'Maakt het mogelijk je bezoek te koppelen aan Google-advertentiecampagnes en advertenties voor deze site te tonen. Los van de statistieken.'
is_functional = false

[params]
site_logo = "images/logo.jpg"
favicon = "img/favicon/favicon.ico"
mainSections = ["posts"]
# First year the site itself was published (first commit, 2024-10-02); the
# footer prints a range ending at the build year. Not the year the business or
# the teaching started -- that belongs in the About text, not in a copyright
# notice, which covers this site's own content.
copyright_start_year = 2024
# Preview image for links shared on social media. Previously this came from the
# featured_image cascade, which also stamped a full-height cover on every page.
images = ["/img/logo.jpg"]

# Dates belong on blog posts, not on About/Contact/Resources. Posts opt back in
# via the cascade in content/posts/_index.*.md
[params.ananke.pages]
show_date = false

# The home page body used to be centred, which was fine for two sentences but
# turned the intro's bullet list into a ragged column. Left-aligning is the
# theme's own option; we no longer ship a copy of home.html to hardcode it.
[params.ananke.home]
content_alignment = "left"
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-black"
recent_posts_number = 3

[params.ananke.social.instagram]
username = 'javchudutch'
[params.ananke.social.facebook]
username = 'javchudutch'
[params.ananke.social.email]
username = 'info@javchudutch.com'
[params.ananke.social.buymeacoffee]
username = 'javchudutch'

# ananke >= 2.11 keys networks by slug instead of using an array of tables,
# and ships definitions for email/facebook/instagram itself. Only the two
# deviations we actually need are declared here.

# The theme sets profile = false for email; we do want a mailto: follow link.
[params.ananke.social.networks.email]
profile = "mailto:%s"

# Not shipped by the theme; icon lives in assets/ananke/socials/buymeacoffee.svg
[params.ananke.social.networks.buymeacoffee]
slug = "buymeacoffee"
label = "Buy me a coffee"
color = "#f5d607"
profile = "https://buymeacoffee.com/%s"
icon = "buymeacoffee"
share = false

[params.ananke.social.follow]
new_window_icon = false
networks = ["facebook", "instagram", "email", "buymeacoffee"]

# Only networks with a real share endpoint belong here. Instagram and
# Buy me a coffee have none and used to render broken "%!s(<nil>)" links.
[params.ananke.social.share]
icons = true
sharetext = true
networks = ["facebook", "email"]

[[params.consent.items]]
slug = 'analytics'
title = 'Visitor statistics'
description = 'Google Analytics counts page views and stores a cookie with a unique identifier in your browser.'
is_functional = false

[[params.consent.items]]
slug = 'advertising'
title = 'Advertising'
description = 'Allows your visit to be linked to Google advertising campaigns and ads for this site to be shown. Separate from statistics.'
is_functional = false

[markup.goldmark.renderer]
unsafe = true

# Newer Hugo refuses raw HTML files as content by default
# (security.allowContent = ['! ^text/html$']). The whole /speech section is
# built from such files, so the policy is opened up again here.
[security]
allowContent = ['.']
